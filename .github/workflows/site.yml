name: Build and publish site

on:
  schedule:
    # Tuesdays 06:00 UTC, after the weekend's results and before midweek games.
    - cron: "0 6 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two builds publish at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The downloaded CSV/JSON archive rarely changes for past seasons, so it
      # is cached between runs. A miss just means a slower build, not a failure.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: epl-raw-${{ github.run_id }}
          restore-keys: epl-raw-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Fetch data
        run: python -m epl.cli fetch

      - name: Backtest
        run: python -m epl.cli backtest

      - name: Build site
        run: python -m epl.cli site --repo-url "https://github.com/${{ github.repository }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
