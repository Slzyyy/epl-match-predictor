name: Build and publish site

on:
  schedule:
    # The league plays two or three times a week, so a weekly rebuild left
    # fixtures that had already been played sitting on the page as upcoming,
    # and the table a full round behind. These three cover the real calendar:
    #   06:00 daily  - the previous day's results, whenever they finished
    #   23:00 daily  - the same evening, after a 20:00 UK kick-off (done by
    #                  about 22:00, which is 21:00-22:00 UTC either side of
    #                  the clock change)
    #   18:00 Sat/Sun - after the lunchtime and 15:00 kick-offs, so the table
    #                  is right while people are still watching
    # Scheduled runs are best-effort on GitHub's side and can be late or
    # skipped under load; the live-score block covers the gap either way.
    - cron: "0 6 * * *"
    - cron: "0 23 * * *"
    - cron: "0 18 * * 6,0"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents: write so the prediction log can be committed back; the record
  # has to outlive the runner or there is no track record.
  contents: write
  pages: write
  id-token: write

# Never let two builds publish at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The downloaded CSV/JSON archive rarely changes for past seasons, so it
      # is cached between runs. A miss just means a slower build, not a failure.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: epl-raw-${{ github.run_id }}
          restore-keys: epl-raw-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Fetch data
        run: python -m epl.cli fetch

      # The whole archive is ~4,600 requests against a free site, so each run
      # takes a bounded bite, newest season first. The download is resumable
      # and data/raw is cached between runs, so it fills in over a few days
      # and then only tops up the current season. Never fails the build: the
      # club pages drop the multi-season table when the archive is too thin
      # rather than repeating this season under a second heading.
      - name: Top up the line-up archive
        run: python -m epl.cli rosters --budget 400 --max-seconds 240
        continue-on-error: true
        timeout-minutes: 6

      - name: Backtest
        run: python -m epl.cli backtest

      - name: Record predictions and score past ones
        run: python -m epl.cli log --backfill

      - name: Commit the prediction log
        run: |
          if git diff --quiet -- predictions/log.csv; then
            echo "no change to the prediction log"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/log.csv
          git commit -m "Update prediction log [skip ci]"
          # Another run may have pushed in the meantime; rebase rather than fail.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build site
        run: python -m epl.cli site --repo-url "https://github.com/${{ github.repository }}"

      # After the build, because the projection is produced while the site is
      # rendered. Kept separate from the prediction-log commit above so a
      # failing build cannot cost us that record.
      - name: Commit the projection log
        run: |
          if git diff --quiet -- predictions/projection_log.csv; then
            echo "no change to the projection log"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/projection_log.csv
          git commit -m "Update projection log [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
