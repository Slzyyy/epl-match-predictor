name: Build and publish site

on:
  schedule:
    # Tuesdays 06:00 UTC, after the weekend's results and before midweek games.
    - cron: "0 6 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents: write so the prediction log can be committed back; the record
  # has to outlive the runner or there is no track record.
  contents: write
  pages: write
  id-token: write

# Never let two builds publish at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The downloaded CSV/JSON archive rarely changes for past seasons, so it
      # is cached between runs. A miss just means a slower build, not a failure.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: epl-raw-${{ github.run_id }}
          restore-keys: epl-raw-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Fetch data
        run: python -m epl.cli fetch

      - name: Fetch current-season line-ups
        # Only the current season: the club pages show this season's players,
        # and the full archive would be ~4,600 requests against a free site.
        run: |
          python - <<'PY'
          from epl.config import LAST_SEASON
          from epl.lineups import download_season_rosters
          download_season_rosters(LAST_SEASON)
          PY

      - name: Backtest
        run: python -m epl.cli backtest

      - name: Record predictions and score past ones
        run: python -m epl.cli log --backfill

      - name: Commit the prediction log
        run: |
          if git diff --quiet -- predictions/log.csv; then
            echo "no change to the prediction log"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/log.csv
          git commit -m "Update prediction log [skip ci]"
          # Another run may have pushed in the meantime; rebase rather than fail.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build site
        run: python -m epl.cli site --repo-url "https://github.com/${{ github.repository }}"

      # After the build, because the projection is produced while the site is
      # rendered. Kept separate from the prediction-log commit above so a
      # failing build cannot cost us that record.
      - name: Commit the projection log
        run: |
          if git diff --quiet -- predictions/projection_log.csv; then
            echo "no change to the projection log"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/projection_log.csv
          git commit -m "Update projection log [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
